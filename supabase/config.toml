project_id = "hackerdojo"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 200

[db]
port = 54322
major_version = 17

[db.pooler]
enabled = true
default_pool_size = 20
max_client_conn = 200

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "20MiB"

[auth]
enabled = true
site_url = "hackerdojo://"
additional_redirect_urls = ["hackerdojo://auth/callback", "https://app.hackerdojo.org/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 600

[auth.email.template.magic_link]
subject = "Your Hacker Dojo sign-in link"

[auth.sms]
enable_signup = false
enable_confirmations = true
max_frequency = "60s"

# Password policy. Supabase enforces this server-side; the mobile Zod schema
# mirrors it so the user gets the error before the round trip, never instead of it.
[auth.password]
min_length = 8
required_characters = "abcdefghijklmnopqrstuvwxyz:ABCDEFGHIJKLMNOPQRSTUVWXYZ:0123456789"

[auth.rate_limit]
email_sent = 10
sms_sent = 10
sign_in_sign_ups = 30
token_refresh = 150
otp = 30

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
skip_nonce_check = false

[auth.external.apple]
enabled = true
client_id = "env(SUPABASE_AUTH_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"

[analytics]
enabled = false

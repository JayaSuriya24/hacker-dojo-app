project_id = "hackerdojo"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 200

[db]
port = 54322
major_version = 17

[db.pooler]
enabled = true
default_pool_size = 20
max_client_conn = 200

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "20MiB"

[auth]
enabled = true
site_url = "hackerdojo://"
# Supabase silently falls back to `site_url` when a requested `redirect_to` is
# not listed here. On web the app asks for its own origin, so without the
# localhost entries a confirmation email pointed at `hackerdojo://` — a custom
# scheme a browser cannot open, which is why the link dead-ended.
# 127.0.0.1 is a distinct origin from localhost and needs its own entry.
additional_redirect_urls = [
  "hackerdojo://auth/callback",
  "https://app.hackerdojo.org/auth/callback",
  "http://localhost:8081/auth/callback",
  "http://127.0.0.1:8081/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 600

# Custom email templates need either a paid plan or a custom SMTP provider —
# `config push` fails the WHOLE auth update with a 400 otherwise, so this stays
# commented until [auth.email.smtp] is configured. It still applies to a local
# `supabase start`, which runs its own Inbucket and does not care.
# [auth.email.template.magic_link]
# subject = "Your Hacker Dojo sign-in link"

[auth.sms]
enable_signup = false
enable_confirmations = true
max_frequency = "60s"

# Password policy. Supabase enforces this server-side; the mobile Zod schema
# mirrors it so the user gets the error before the round trip, never instead of it.
[auth.password]
min_length = 8
required_characters = "abcdefghijklmnopqrstuvwxyz:ABCDEFGHIJKLMNOPQRSTUVWXYZ:0123456789"

[auth.rate_limit]
email_sent = 10
sms_sent = 10
sign_in_sign_ups = 30
token_refresh = 150
otp = 30

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
skip_nonce_check = false

# Off until the Apple credentials exist. Enabling a provider with an empty
# secret does not fail loudly — it pushes a broken provider that answers every
# sign-in attempt with an invalid_client error from Apple.
#
# To turn on: create a Services ID and an ES256 .p8 key in the Apple Developer
# portal, mint the client secret JWT from the key, put both in `supabase/.env`,
# flip `enabled` back to true and run `supabase config push`.
#
# Note this is separate from the NATIVE flow the app actually uses on iOS —
# `signInWithIdToken` in auth.service.ts — which App Store guideline 4.8
# requires. That one needs this provider configured too.
[auth.external.apple]
enabled = false
client_id = "env(SUPABASE_AUTH_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"

[analytics]
enabled = false
